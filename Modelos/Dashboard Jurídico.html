<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Jurídico</title>
<style>
:root{--bg:#003641;--card:#0a4a57;--ln:#0f6070;--tx:#fff;--mut:#a9cdd2;--a:#00AE9D;--b:#C9D200;--c:#7DB61C;--neg:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]){}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",Arial,sans-serif}
.wrap{display:grid;grid-template-columns:220px 1fr;gap:14px;padding:14px;max-width:1400px;margin:auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.side,.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
h1{font-size:18px;margin:0 0 2px;color:var(--b)}h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--b)}
label{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}
select,input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--ln);background:#022a33;color:var(--tx);font:inherit}
.seg{display:grid;gap:6px}.seg button{text-align:left}
button{cursor:pointer;border:1px solid var(--a);background:transparent;color:var(--tx);padding:8px 10px;border-radius:8px;font:inherit}
button.on,button.pri{background:var(--a);color:#003641;font-weight:600}
button.del{border-color:var(--neg);color:var(--neg)}button.sm{padding:3px 8px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.k small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.k b{display:block;font-size:22px;margin-top:4px}
.k.hi{background:linear-gradient(135deg,var(--c),var(--b));color:#003641}.k.hi small{color:#003641}
.k.al{background:#022a33;border-color:var(--neg)}.k.al b{color:var(--neg)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}
th{background:var(--a);color:#003641;text-align:left;padding:7px;font-size:12px;position:sticky;top:0}
td{padding:6px 7px;border-bottom:1px solid var(--ln);font-size:13px}tr:nth-child(even) td{background:#08414e}
.tb{max-height:330px;overflow:auto}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--a);border-radius:12px;width:min(520px,94vw)}
dialog::backdrop{background:#000a}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:12px;color:var(--mut);margin:8px 0}.pill{padding:2px 8px;border-radius:99px;background:#022a33;font-size:11px}
</style></head><body>
<div class="wrap">
<aside class="side">
 <h1>Jurídico</h1><div class="msg" id="modo">Carregando…</div>
 <label>Ano</label><select id="fAno"></select>
 <label>Mês</label><select id="fMes"></select>
 <label>Origem</label><div class="seg" id="fOri"></div>
 <label>Consulta nome</label><input id="fNome" placeholder="Autor ou réu">
 <p><button id="limpar" style="width:100%">Limpar filtros</button></p>
 <p><button class="pri" id="novo" style="width:100%" hidden>+ Novo registro</button></p>
 <p><button id="csv" style="width:100%">Exportar CSV</button></p>
</aside>
<main>
 <div class="kpis" id="kpis"></div>
 <div class="card" style="margin-bottom:14px"><h3>Ativo × Passivo ao longo do tempo</h3>
  <div class="leg"><span><i style="background:var(--neg)"></i>Passivo</span><span><i style="background:var(--c)"></i>Ativo</span></div>
  <div class="scroll"><svg id="chart" viewBox="0 0 900 250" style="width:100%;min-width:640px"></svg></div></div>
 <div class="card"><h3>Tipo de ações</h3><div class="tb scroll"><table><thead><tr>
  <th>Origem</th><th>Autor(es)</th><th>Réu(s)</th><th>Contrato Sicoob</th><th>Nº Processo</th><th>Status</th><th>Natureza</th><th>Valor</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div>

<dialog id="dlg"><h3 id="dt">Registro</h3>
 <div class="g2">
  <div><label>Origem</label><select id="o"><option>Cooperativa Autora</option><option>Cooperativa Ré</option><option>Enviado ao Jurídico</option><option>Extrajudicial</option></select></div>
  <div><label>Data</label><input id="d" type="date"></div>
  <div><label>Autor(es)</label><input id="a"></div><div><label>Réu(s)</label><input id="r"></div>
  <div><label>Contrato Sicoob</label><input id="c"></div><div><label>Nº Processo (ajuizamento)</label><input id="p"></div>
  <div><label>Status</label><select id="s"><option>Aguardando Cumprimento de Subsídio</option><option>Notificação Não Realizada</option><option>Procedimento Cancelado</option><option>Aguardando Prazo para Pagamento</option><option>Encaminhada para Ajuizamento</option><option>Em atraso</option><option>Extinto</option></select></div>
  <div><label>Natureza</label><select id="n"><option>Ativo</option><option>Passivo</option><option>Extinta</option></select></div>
  <div><label>Valor (R$)</label><input id="v" type="number" step="0.01"></div><div><label>Custas / Honorários (R$)</label><input id="h" type="number" step="0.01"></div>
 </div>
 <p style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="cancel">Cancelar</button><button class="pri" id="save">Salvar</button></p>
 <div class="msg" id="err"></div>
</dialog>

<script>
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const $=id=>document.getElementById(id),brl=n=>(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let data=[],db=null,coll=null,canWrite=false,ori="",editId=null;
function esc(s){const e=document.createElement("span");e.textContent=s??"";return e.innerHTML}
function filtered(){const y=$("fAno").value,m=$("fMes").value,q=$("fNome").value.toLowerCase();
 return data.filter(x=>(!y||(x.d||"").slice(0,4)===y)&&(m===""||+(x.d||"").slice(5,7)-1===+m)&&(!ori||x.o===ori)&&(!q||((x.a||"")+" "+(x.r||"")).toLowerCase().includes(q)))}
function render(){
 const ys=[...new Set(data.map(x=>(x.d||"").slice(0,4)).filter(Boolean))].sort(),cur=$("fAno").value;
 $("fAno").innerHTML='<option value="">Todos</option>'+ys.map(y=>`<option ${y===cur?"selected":""}>${y}</option>`).join("");
 const f=filtered(),sum=n=>f.filter(x=>x.n===n).reduce((s,x)=>s+(+x.v||0),0);
 const K=[["Solicitações enviadas ao jurídico",f.length,"hi"],["Contratos em atraso judicial",f.filter(x=>/atraso/i.test(x.s)).length,"al"],
 ["Total valor Passivo",brl(sum("Passivo"))],["Total valor Ativo",brl(sum("Ativo"))],["Total valor Extinta",brl(sum("Extinta"))],
 ["Custas / honorários",brl(f.reduce((s,x)=>s+(+x.h||0),0))],["Processos extintos",f.filter(x=>x.n==="Extinta"||/extint/i.test(x.s)).length],["Processos ajuizados",f.filter(x=>x.p).length]];
 $("kpis").innerHTML=K.map(k=>`<div class="k ${k[2]||""}"><small>${k[0]}</small><b>${esc(k[1])}</b></div>`).join("");
 // gráfico
 const A=Array(12).fill(0),P=Array(12).fill(0);
 f.forEach(x=>{const m=+(x.d||"").slice(5,7)-1;if(m>=0){if(x.n==="Ativo")A[m]+=+x.v||0;if(x.n==="Passivo")P[m]+=+x.v||0}});
 const mx=Math.max(1,...A,...P);let s="";
 MES.forEach((n,i)=>{const x=20+i*72,ha=A[i]/mx*180,hp=P[i]/mx*180;
  s+=`<rect x="${x}" y="${200-hp}" width="26" height="${hp}" fill="#ff6b6b" rx="3"/><rect x="${x+28}" y="${200-ha}" width="26" height="${ha}" fill="#7DB61C" rx="3"/>`;
  s+=`<text x="${x+27}" y="220" fill="#a9cdd2" font-size="11" text-anchor="middle">${n.slice(0,3)}</text>`;
  if(P[i])s+=`<text x="${x+13}" y="${195-hp}" fill="#fff" font-size="9" text-anchor="middle">${(P[i]/1000).toFixed(0)}k</text>`;
  if(A[i])s+=`<text x="${x+41}" y="${195-ha}" fill="#fff" font-size="9" text-anchor="middle">${(A[i]/1000).toFixed(0)}k</text>`});
 $("chart").innerHTML=s;
 $("rows").innerHTML=f.length?f.map(x=>`<tr><td>${esc(x.o)}</td><td>${esc(x.a)}</td><td>${esc(x.r)}</td><td>${esc(x.c)}</td><td>${esc(x.p)}</td><td>${esc(x.s)}</td><td><span class="pill">${esc(x.n)}</span></td><td>${brl(+x.v)}</td><td style="white-space:nowrap">${canWrite?`<button class="sm" data-e="${x.id}">Editar</button> <button class="sm del" data-x="${x.id}">Excluir</button>`:""}</td></tr>`).join(""):`<tr><td colspan="9" style="color:var(--mut)">Nenhum registro. ${canWrite?'Use "+ Novo registro".':""}</td></tr>`;
}
function setup(){
 $("fMes").innerHTML='<option value="">Todos</option>'+MES.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
 const O=["Cooperativa Autora","Cooperativa Ré","Enviado ao Jurídico","Extrajudicial"];
 $("fOri").innerHTML=O.map(o=>`<button data-o="${o}">${o}</button>`).join("");
 $("fOri").onclick=e=>{const b=e.target.closest("button");if(!b)return;ori=ori===b.dataset.o?"":b.dataset.o;[...$("fOri").children].forEach(c=>c.classList.toggle("on",c.dataset.o===ori));render()};
 ["fAno","fMes"].forEach(i=>$(i).onchange=render);$("fNome").oninput=render;
 $("limpar").onclick=()=>{$("fAno").value=$("fMes").value=$("fNome").value="";ori="";[...$("fOri").children].forEach(c=>c.classList.remove("on"));render()};
 $("novo").onclick=()=>open(null);
 $("cancel").onclick=()=>$("dlg").close();
 $("rows").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)open(b.dataset.e);
  if(b.dataset.x&&confirm("Excluir este registro?")){try{if(coll)await coll.doc(b.dataset.x).delete();else data=data.filter(x=>x.id!==b.dataset.x);render()}catch(er){alert("Sem permissão para excluir.")}}};
 $("save").onclick=save;
 $("csv").onclick=()=>{const h=["o","d","a","r","c","p","s","n","v","h"],l=[h.join(";")].concat(filtered().map(x=>h.map(k=>`"${String(x[k]??"").replace(/"/g,'""')}"`).join(";")));
  const u=URL.createObjectURL(new Blob(["\ufeff"+l.join("\n")],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="processos.csv";a.click()};
}
function open(id){editId=id;const x=data.find(z=>z.id===id)||{};$("dt").textContent=id?"Editar registro":"Novo registro";$("err").textContent="";
 const m={o:"o",d:"d",a:"a",r:"r",c:"c",p:"p",s:"s",n:"n",v:"v",h:"h"};for(const k in m)$(k).value=x[k]??"";
 if(!id){$("d").value=new Date().toISOString().slice(0,10)}$("dlg").showModal()}
async function save(){const r={};for(const k of["o","d","a","r","c","p","s","n"])r[k]=$(k).value.trim();
 r.v=parseFloat($("v").value)||0;r.h=parseFloat($("h").value)||0;
 if(!r.a&&!r.r){$("err").textContent="Informe ao menos autor ou réu.";return}
 try{if(coll){editId?await coll.doc(editId).set(r):await coll.add(r)}else{editId?Object.assign(data.find(z=>z.id===editId),r):data.push({id:"l"+Date.now(),...r});render()}
  $("dlg").close()}catch(e){$("err").textContent="Sem permissão para gravar (é preciso ser Contributor ou superior)."}}
async function init(){
 setup();
 try{
  const c=window.claude&&await claude.use("db"),u=window.claude&&await claude.use("user");
  if(c){db=c;coll=c.collection("processos");canWrite=u?u.can("data.write")!==false:true;
   $("modo").innerHTML=canWrite?"Modo <b>edição</b> (usuário autorizado)":"Modo <b>somente leitura</b>";
   coll.onSnapshot(s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
   $("novo").hidden=!canWrite;render();return}
 }catch(e){}
 // sem banco: demonstração local (dados fictícios, não persistem)
 canWrite=true;$("novo").hidden=false;$("modo").innerHTML="Modo <b>demonstração</b> (dados fictícios, não salvos)";
 const nm=["Silva Ltda","João Pereira","Maria Souza","Agro Norte","Carlos Lima","ATL Filtros"],S=["Notificação Não Realizada","Em atraso","Encaminhada para Ajuizamento","Aguardando Prazo para Pagamento"],N=["Ativo","Passivo","Extinta"];
 data=Array.from({length:30},(_,i)=>({id:"d"+i,o:["Cooperativa Autora","Cooperativa Ré","Enviado ao Jurídico","Extrajudicial"][i%4],d:`2026-${String(i%12+1).padStart(2,"0")}-10`,a:"Juriscredcelg",r:nm[i%6],c:i%3?"":"1"+(67245+i),p:i%2?"0001234-"+i:"",s:S[i%4],n:N[i%3],v:(i*7919%90+10)*1000,h:(i%5)*400}));
 render();
}
init();
</script></body></html>
